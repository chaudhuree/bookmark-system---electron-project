<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readit - Bookmark Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <header>
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search" placeholder="Search bookmarks...">
        </div>
        <button id="show-modal" title="Add Bookmark"><i class="fas fa-plus"></i></button>
    </header>

    <main>
        <div id="no-items" class="no-items-state">
            <i class="fas fa-bookmark no-items-icon"></i>
            <p>No Bookmarks Saved Yet</p>
        </div>
        <div id="items"></div>
    </main>

    <div id="modal">
        <div class="modal-card">
            <h3>Add New Bookmark</h3>
            <div class="input-group">
                <i class="fas fa-link input-icon"></i>
                <input type="text" id="url" placeholder="Paste website URL here...">
            </div>
            <div class="modal-actions">
                <button id="close-modal">Cancel</button>
                <button id="add-item">Add Bookmark</button>
            </div>
        </div>
    </div>

    <script>
        require('./app')
    </script>
</body>

</html>
